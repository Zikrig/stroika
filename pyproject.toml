[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stroika-bot"
version = "0.1.0"
description = "Telegram request tracking bot for construction workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.4.1",
  "aiosqlite>=0.20.0",
  "openpyxl>=3.1.5",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
